name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # CI has no .env.local, so the build never contains a demo key. Guard anyway.
      - name: Refuse a build with an embedded API key
        run: test ! -f dist/embedded-key-warning.txt

      - name: Package extension
        run: |
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          (cd dist && zip -r -q "../release/vocab-explainer-$VERSION.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error

  publish:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: release

      - name: Locate zip
        id: zip
        run: echo "path=$(ls release/*.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.zip.outputs.path }}
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
